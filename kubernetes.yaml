apiVersion: v1
kind: Namespace
metadata:
  name: curso-contenedores
  labels:
    app: curso-contenedores
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: curso-contenedores-config
data:
  AMBIENTE: develop
  DB_HOST: curso-contenedores-postgres
  DB_USERNAME: pguser-app
  DB_NAME: cursodb
  ENABLE_DB: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: curso-contenedores-secret
type: Opaque
stringData:
  DB_PASSWORD: pgpassword-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curso-contenedores
  namespace: curso-contenedores
  labels:
    app: curso-contenedores
spec:
  replicas: 5
  selector:
    matchLabels:
      app: curso-contenedores
  template:
    metadata:
      labels:
        app: curso-contenedores
    spec:
      imagePullSecrets:
        - name: regcred-gh
      containers:
        - name: curso-contenedores
          image: ghcr.io/carlosmarind/curso-contenedores:latest
          imagePullPolicy: Always
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: curso-contenedores-config
                  key: AMBIENTE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: curso-contenedores-config
                  key: DB_HOST
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: curso-contenedores-config
                  key: DB_USERNAME
                  optional: true
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: curso-contenedores-config
                  key: DB_NAME
            - name: ENABLE_DB
              valueFrom:
                configMapKeyRef:
                  name: curso-contenedores-config
                  key: ENABLE_DB
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: curso-contenedores-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: curso-contenedores
  namespace: curso-contenedores
  labels:
    app: curso-contenedores
spec:
  selector:
    app: curso-contenedores
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000 
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: curso-contenedores
  namespace: curso-contenedores
  labels:
    app: curso-contenedores
spec:
  ingressClassName: nginx
  rules:
    - host: app.local
      http:
        paths:
        - pathType: Prefix
          path: /
          backend:
            service:
              name: curso-contenedores
              port:
                number: 80
---
